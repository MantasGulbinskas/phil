  - heading "Latest weekly review" [level=2] [ref=f1e125]
  - paragraph [ref=f1e126]: "2026-10-05: two independent critics (Claude and OpenAI) reviewed the lessons, the agenda and the methods. Assay has run three tests, all on pre-built Fama-French factors standing in for the original papers, and all three failed or weakened after publication. The two lessons it wrote are plausible but were both drawn from the single profitability test, and one describes a Sharpe decline that was never measured. Keep them as candidates, link the momentum and reversal tests to them, and do not promote them yet."
  - list [ref=f1e127]:
    - listitem [ref=f1e128]: "Changes both agreed on: dropped agenda item q_110c32978c3c; dropped agenda item q_fb63735ec2a3; dropped agenda item q_facbaa3c4131; dropped agenda item q_cad72e589515."
    - listitem [ref=f1e129]: "Concern (high): Trading costs applied to Fama-French factor return series: Two of three grades (momentum, reversal: dies_to_costs) are decided entirely by Assay's medium cost level. A factor return series has no observable turnover, so the cost drag must come from an assumed turnover times an assumed per-trade cost. For momentum the implied drag is about 6%/yr (4.5% before costs to -1.5% after), which is at the high end of published estimates for the UMD-type factor. Reversal would die under almost any assumption, but momentum's grade could flip to 'weakened' under a different plausible cost. The library should record the turnover and per-trade cost actually used, and at least one test should use costs measured in a paper rather than assumed."
    - listitem [ref=f1e130]: "Concern (medium): Fidelity is unlabelled on every test, and Rule 1 'reproduce first' is near-tautological for factor data: All three tests use pre-built Fama-French factors as stand-ins for the papers' strategies (RMW for gross profitability; the FF mom and ST_Rev series for JT 1993 and Jegadeesh 1990). Checking that a published factor made money in its own published sample does not test Assay's implementation; it tests Ken French's. These should be labelled proxy fidelity so that lessons built on them are weighted accordingly."
    - listitem [ref=f1e131]: "Concern (medium): Lesson creation from a single test: Both lessons were minted from one weakened, proxy-fidelity test, and one of them describes a Sharpe-ratio decline when only annual returns and t-stats were recorded. Meanwhile the two dies_to_costs tests in the library are linked to no lesson at all. The lesson writer appears to generalise from the most recent test rather than from the library. A minimum of two linked tests before a candidate lesson is written would prevent this."
    - listitem [ref=f1e132]: "Concern (medium): Vocabulary gap exposed by the Moreira & Muir rejection: The verifier rejected the test because the only scaling tool is vol_target_annual (1/sigma) with no inverse-variance (1/sigma^2) option and no leverage cap. Several queued items (volatility-managed factors, volatility targeting on bitcoin) will hit the same wall. Either the vocabulary gains a weight-cap parameter or those items should be re-specified to the capped vol-target variants the papers themselves report."
    - listitem [ref=f1e133]: "Concern (high): test_d9ae70031a5c and fidelity reporting: All three tests have unlabelled fidelity. The profitability test explicitly substitutes Fama-French RMW for Novy-Marx's gross-profitability strategy. Passing an in-sample return threshold does not validate that substitution. Record this as proxy evidence and audit the other two constructions before treating their grades as paper replications."
    - listitem [ref=f1e134]: "Concern (high): Trading-cost assumptions in all three tests: The reported gross-to-net annual drags are 1.2 percentage points for profitability and 6.0 points each for momentum and reversal. Costs determine two grades, yet these summaries provide no turnover, per-trade rates, or implementation assumptions. The identical momentum and reversal drags warrant checking; they are not themselves evidence of an error."
