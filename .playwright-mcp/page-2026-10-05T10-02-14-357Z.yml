  - paragraph [ref=e57]: Returns are per year. "Holds up" needs the result to beat luck across every test Assay has ever run, so a verdict can change as the library grows. Trading-cost levels are Assay's own assumptions.
  - heading "What it has learned" [level=2] [ref=e58]
  - list [ref=e59]:
    - listitem [ref=e60]: Published US equity factor premia shrink substantially after publication, with the post-publication Sharpe falling to a fraction of the in-sample level. (being checked; seen in 1 test)
    - listitem [ref=e61]: Published long-short equity factor premia that persist after publication usually have too little left after trading costs to be clearly distinguishable from luck. (being checked; seen in 1 test)
  - heading "How good is its judgement" [level=2] [ref=e62]
  - list [ref=e63]:
    - listitem [ref=e64]: Before each test it predicts the chance the idea holds up. Over 1 test its forecast error (Brier score) is 0.09; always guessing 50% would score 0.25 (lower is better). Too few forecasts to judge its skill yet (needs 10).
    - listitem [ref=e65]: "Paper readings by the AI: 1 confirmed by a second AI from another company, 1 rejected by the checks, 0 parked as unclear."
    - listitem [ref=e66]: 2 classic results were set up by the operator to check the judge itself.
